# Install root-owned as /etc/sudoers.d/wapala-codex with mode 0440.
# Auto-start/enable, arbitrary units, shells and deployment are NOT granted.
codex ALL=(root) NOPASSWD: NOSETENV: /usr/local/sbin/wapala-service start, /usr/local/sbin/wapala-service stop, /usr/local/sbin/wapala-service restart, /usr/local/sbin/wapala-service status
