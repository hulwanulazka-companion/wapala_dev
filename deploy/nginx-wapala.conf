# Replace wapala.example.org and provision the certificate before enabling TLS.
# --- Cloudflare CDN (opsional): restore real client IP -------------------
# Behind a Cloudflare proxy, $remote_addr at the origin is the CF edge IP;
# without this block every visitor would share one throttle bucket (the app
# trusts the X-Forwarded-For we send). The realip module only trusts the
# official Cloudflare ranges — harmless when CF is not used.
# Official list: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
# Cloudflare notes: SSL/TLS Full (strict) on the dashboard; do NOT enable
# Cache Everything for HTML/auth/API (CSP nonce is per response); immutable
# /_next/static assets are cached at the edge automatically.
server {
    listen 80;
    server_name wapala.example.org;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name wapala.example.org;
    ssl_certificate /etc/letsencrypt/live/wapala.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wapala.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
}
